<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Unity WebGL Country Test</title>
  <style>
    body {
      margin: 0;
      background: #222;
      color: white;
      font-family: sans-serif;
    }
    #unity-canvas {
      width: 960px;
      height: 540px;
      background: black;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<h2>Country Test</h2>

<button onclick="sendCountry('US')">US</button>
<button onclick="sendCountry('CN')">CN</button>
<button onclick="sendCountry('JP')">JP</button>
<button onclick="sendCountry('GR')">GR</button>
<button onclick="sendCountry('ALL')">ALL</button>

<!-- ✅ 반드시 HTML에 canvas를 직접 둔다 -->
<canvas id="unity-canvas"></canvas>

<script src="Build/webggl.loader.js"></script>
<script>
let unityInstance = null;

// ✅ DOM에 이미 존재하는 canvas를 가져온다
const canvas = document.getElementById("unity-canvas");

const config = {
  dataUrl: "Build/webggl.data",
  frameworkUrl: "Build/webggl.framework.js",
  codeUrl: "Build/webggl.wasm",
  companyName: "DW",
  productName: "DWProject2",
  productVersion: "1.0"
};

createUnityInstance(canvas, config).then((instance) => {
  unityInstance = instance;
  console.log("Unity 로드 완료");
}).catch((err) => {
  console.error(err);
});

function sendCountry(country) {
  if (!unityInstance) {
    alert("Unity 아직 로딩 중");
    return;
  }

  unityInstance.SendMessage(
    "DummyGate",           // AirportSceneController가 붙은 GameObject 이름
    "SetCountryFromWeb",   // Unity 함수명
    country
  );
}
</script>

</body>
</html>
